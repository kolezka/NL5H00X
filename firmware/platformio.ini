; ESP32-C6 needs Arduino core 3.x, which only the pioarduino platform ships.
[env:esp32-c6-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitc-1
; The DevKitC profile assumes 8 MB; the SuperMini's ESP32-C6FH4 has 4 MB.
board_upload.flash_size = 4MB
board_build.partitions = default.csv
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Flash over Wi-Fi: PROJECTOR_OTA_PASSWORD=... pio run -e ota -t upload
[env:ota]
extends = env:esp32-c6-supermini
upload_protocol = espota
upload_port = projector-uart.local
upload_flags =
  --port=3232
  --auth=${sysenv.PROJECTOR_OTA_PASSWORD}
